<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Noto Sans CJK TC', 'Microsoft JhengHei', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>VAE decoder 一次 forward 中各階段的張量大小</title>
<desc>方塊邊長正比於空間解析度。latent 16×128×128 經三次上採樣放大到 1024×1024，最大的中間張量 128×1024×1024 在 fp32 下約 512 MB。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="329" rx="10" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="50" y="172" width="18" height="18" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<rect x="94" y="172" width="18" height="18" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<rect x="138" y="154" width="36" height="36" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<rect x="200" y="118" width="72" height="72" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<rect x="298" y="46" width="144" height="144" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<rect x="468" y="46" width="144" height="144" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<line x1="72" y1="181" x2="90" y2="181" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="116" y1="181" x2="134" y2="181" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="178" y1="181" x2="196" y2="181" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="276" y1="181" x2="294" y2="181" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="446" y1="181" x2="464" y2="181" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="59.0" y="212" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central" font-weight="600">① 輸入 latent</text>
<text x="59.0" y="229" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">16×128×128</text>
<text x="59.0" y="246" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-weight="400">1 MB</text>
<line x1="103.0" y1="194" x2="103.0" y2="260" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="3 3"/>
<text x="103.0" y="272" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central" font-weight="600">② 撐開 channel</text>
<text x="103.0" y="289" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">512×128×128</text>
<text x="103.0" y="306" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-weight="400">32 MB</text>
<text x="156.0" y="212" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central" font-weight="600">③ 上採樣 ×2</text>
<text x="156.0" y="229" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">512×256×256</text>
<text x="156.0" y="246" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-weight="400">128 MB</text>
<line x1="236.0" y1="194" x2="236.0" y2="260" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="3 3"/>
<text x="236.0" y="272" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central" font-weight="600">④ 上採樣 ×2</text>
<text x="236.0" y="289" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">256×512×512</text>
<text x="236.0" y="306" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-weight="400">256 MB</text>
<text x="370.0" y="212" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central" font-weight="600">⑤ 上採樣 ×2</text>
<text x="370.0" y="229" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">128×1024×1024</text>
<text x="370.0" y="246" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central" font-weight="600">512 MB</text>
<line x1="540.0" y1="194" x2="540.0" y2="260" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="3 3"/>
<text x="540.0" y="272" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central" font-weight="600">⑥ 壓成 RGB</text>
<text x="540.0" y="289" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3×1024×1024</text>
<text x="540.0" y="306" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central" font-weight="400">12 MB</text>
<text x="40" y="26" font-size="12" fill="#5F5E5A" text-anchor="start" dominant-baseline="central" font-weight="400">方塊邊長 ∝ 空間解析度；MB = 該張量在 fp32 下的大小（channel × 高 × 寬 × 4 bytes）</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
