<svg xmlns="http://www.w3.org/2000/svg" width="680" height="506" viewBox="0 0 680 506" role="img" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Noto Sans CJK TC', 'Microsoft JhengHei', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>DiT 一次 forward 的內部</title>
<desc>帶雜訊 latent 切成 4096 個 patch token，連同 t 與文字 token 經過 57 個 transformer block，最後投影並拼回同形狀的速度。</desc>
